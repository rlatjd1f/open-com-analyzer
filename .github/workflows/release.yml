name: Build and Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend & TypeScript
        run: npm run build

      # --- Generate Incremental Changelog for this Release ---
      - name: Generate Release Notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "## ⚡️ Open COM Analyzer ${{ github.ref_name }}" > RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md

          if [ -n "$PREV_TAG" ]; then
            echo "### 🔄 이전 버전($PREV_TAG) 이후 변경 내역" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            git log "$PREV_TAG..${{ github.ref_name }}" --pretty=format:"* %s (%h)" --no-merges >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "**전체 커밋 비교**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}" >> RELEASE_BODY.md
          else
            echo "### 🚀 초기 릴리즈 내역" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            git log --pretty=format:"* %s (%h)" --no-merges >> RELEASE_BODY.md
          fi

          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "### 📦 다운로드 파일 (Assets)" >> RELEASE_BODY.md
          echo "* **macOS (Apple Silicon)**: \`COM-Analyzer-macOS-arm64.zip\`" >> RELEASE_BODY.md
          echo "* **macOS (Intel)**: \`COM-Analyzer-macOS-x64.zip\`" >> RELEASE_BODY.md
          echo "* **Windows (64-bit)**: \`COM-Analyzer-Windows-x64.zip\`" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "### 💡 macOS 실행 시 '손상되었기 때문에 열 수 없습니다' 해결 방법" >> RELEASE_BODY.md
          echo "터미널에서 아래 명령어를 1회 실행하여 격리 속성을 해제하세요:" >> RELEASE_BODY.md
          echo "\`\`\`bash" >> RELEASE_BODY.md
          echo "xattr -cr ~/Downloads/COM\ Analyzer.app" >> RELEASE_BODY.md
          echo "\`\`\`" >> RELEASE_BODY.md

      # --- macOS Build Step ---
      - name: Package macOS Application (Apple Silicon & Intel)
        if: matrix.os == 'macos-latest'
        run: |
          RAW_VER="${{ github.ref_name }}"
          VERSION="${RAW_VER#v}"
          VERSION="${VERSION:-1.0.0}"
          npx electron-packager . "COM Analyzer" --platform=darwin --arch=arm64,x64 --icon=assets/icon.icns --app-bundle-id="com.analyzer.comanalyzer" --app-version="$VERSION" --build-version="$VERSION" --out=dist-app --overwrite
          codesign --force --deep --sign - "dist-app/COM Analyzer-darwin-arm64/COM Analyzer.app"
          codesign --force --deep --sign - "dist-app/COM Analyzer-darwin-x64/COM Analyzer.app"
          cd dist-app
          ditto -c -k --sequesterRsrc --keepParent "COM Analyzer-darwin-arm64/COM Analyzer.app" "COM-Analyzer-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "COM Analyzer-darwin-x64/COM Analyzer.app" "COM-Analyzer-macOS-x64.zip"

      # --- Windows Build Step ---
      - name: Package Windows Application (x64)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          RAW_VER="${{ github.ref_name }}"
          VERSION="${RAW_VER#v}"
          VERSION="${VERSION:-1.0.0}"
          npx electron-packager . "COM Analyzer" --platform=win32 --arch=x64 --app-version="$VERSION" --build-version="$VERSION" --out=dist-app --overwrite
          cd dist-app
          7z a -tzip "COM-Analyzer-Windows-x64.zip" "COM Analyzer-win32-x64"

      # --- Release Upload Step ---
      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-app/*.zip
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
